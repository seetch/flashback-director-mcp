plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+mc${project.mc262_minecraft_version}"

base {
    archivesName = "${project.archives_base_name}"
}

sourceSets {
    main {
        java.srcDir '../fabric-shared/src/main/java'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.mc262_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.mc262_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.mc262_fabric_api_version}"

    implementation project(':core')
    include project(':core')

    def flashbackJar = rootProject.file("libs/${project.mc262_flashback_jar}")
    if (flashbackJar.exists()) {
        compileOnly files(flashbackJar)
    } else {
        logger.warn("Missing ${flashbackJar}. Copy Flashback for MC ${project.mc262_minecraft_version} into libs/ before building mc-26.2.")
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.mc262_minecraft_version
    filesMatching('fabric.mod.json') {
        expand(
            'version': project.version,
            'minecraft_version': project.mc262_minecraft_version
        )
    }
}
